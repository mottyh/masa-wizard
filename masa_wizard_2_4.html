<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בחזרה לעתיד — אשף מסע v2.4</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;direction:rtl;background:#0b1220;color:#e2e8f0;min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 80px}
.header{text-align:center;margin-bottom:36px}
.header h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:-0.5px}
.header p{color:#4a6080;font-size:0.88rem;margin-top:5px}
.version-tag{display:inline-block;background:#1a3a5c;border:1px solid #2a5a8c;color:#60a5fa;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:6px;letter-spacing:1px}
.card{background:#111827;border:1px solid #1e2d45;border-radius:18px;padding:32px;width:100%;max-width:580px;box-shadow:0 12px 48px rgba(0,0,0,0.5)}
.steps-bar{display:flex;align-items:center;margin-bottom:32px}
.step-item{display:flex;align-items:center;flex:1}
.step-circle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;transition:all 0.3s;border:2px solid #1e2d45;background:#0b1220;color:#4a6080}
.step-circle.active{border-color:#3b82f6;background:#1e3a6e;color:#93c5fd;box-shadow:0 0 0 4px rgba(59,130,246,0.15)}
.step-circle.done{border-color:#22c55e;background:#14532d;color:#4ade80}
.step-line{flex:1;height:2px;background:#1e2d45;margin:0 4px;transition:all 0.3s}
.step-line.done{background:#22c55e}
.step-title{font-size:1.25rem;font-weight:800;color:#fff;margin-bottom:6px}
.step-sub{color:#4a6080;font-size:0.85rem;margin-bottom:24px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#0b1220;border:2px solid #1e2d45;border-radius:12px;cursor:pointer;transition:all 0.2s;text-align:right;color:#e2e8f0;font-family:'Heebo',sans-serif;font-size:0.95rem;width:100%}
.opt-btn:hover{border-color:#3b82f6;background:#162033}
.opt-btn.selected{border-color:#3b82f6;background:#1e3a6e;color:#93c5fd}
.opt-icon{font-size:1.6rem;flex-shrink:0;width:36px;text-align:center}
.opt-text{text-align:right}
.opt-text strong{display:block;font-weight:700;font-size:0.95rem}
.opt-text span{font-size:0.78rem;color:#64748b;margin-top:2px;display:block}
.field-group{margin-bottom:16px}
.field-label{font-size:0.82rem;font-weight:600;color:#64748b;margin-bottom:6px;display:block;letter-spacing:0.3px}
.field-input{width:100%;padding:11px 14px;background:#0b1220;border:1.5px solid #1e2d45;border-radius:10px;color:#e2e8f0;font-family:'Heebo',sans-serif;font-size:0.95rem;outline:none;transition:border 0.2s}
.field-input:focus{border-color:#3b82f6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group-count-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.group-count-row input[type=range]{flex:1;accent-color:#3b82f6}
.group-count-num{width:64px;padding:8px 10px;background:#0b1220;border:1.5px solid #1e2d45;border-radius:8px;color:#e2e8f0;font-family:'Heebo',sans-serif;font-size:0.95rem;text-align:center;outline:none}
.group-count-num:focus{border-color:#3b82f6}
.groups-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.group-chip{padding:4px 10px;background:#0b1220;border:1px solid #1e2d45;border-radius:20px;font-size:0.75rem;color:#64748b}
.btn{padding:11px 22px;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover:not(:disabled){background:#2563eb;transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,0.3)}
.btn-primary:disabled{background:#1e2d45;color:#4a6080;cursor:not-allowed}
.btn-ghost{background:transparent;color:#64748b;border:1.5px solid #1e2d45}
.btn-ghost:hover{border-color:#64748b;color:#e2e8f0}
.btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:24px}
.alert{padding:12px 14px;border-radius:10px;font-size:0.84rem;margin-bottom:14px;line-height:1.5}
.alert-info{background:#1e3a6e;border:1px solid #2563eb;color:#93c5fd}
.alert-success{background:#14532d;border:1px solid #166534;color:#4ade80}
.alert-warn{background:#431407;border:1px solid #7c2d12;color:#fb923c}
.alert-error{background:#3b0a0a;border:1px solid #7f1d1d;color:#fca5a5}
.script-box{background:#0a1015;border:1px solid #1e2d45;border-radius:8px;padding:12px;font-family:monospace;font-size:0.7rem;color:#4ade80;overflow-y:auto;white-space:pre;line-height:1.5;direction:ltr;text-align:left}
.summary-table{margin-bottom:20px}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a2535;font-size:0.88rem}
.summary-row:last-child{border-bottom:none}
.summary-label{color:#4a6080}
.summary-value{color:#e2e8f0;font-weight:600;max-width:60%;text-align:left;direction:ltr}
.connect-scopes{display:flex;flex-direction:column;gap:6px;margin:12px 0 20px}
.scope-item{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:#64748b}
.scope-dot{width:6px;height:6px;border-radius:50%;background:#3b82f6;flex-shrink:0}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-steps{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.prog-step{display:flex;align-items:center;gap:10px;font-size:0.85rem;padding:8px 12px;background:#0b1220;border:1px solid #1e2d45;border-radius:8px;transition:all 0.3s}
.prog-step.active{border-color:#3b82f6;background:#162033;color:#93c5fd}
.prog-step.done{border-color:#22c55e;background:#0d2b1a;color:#4ade80}
.prog-step.waiting{color:#4a6080}
.prog-icon{width:20px;text-align:center;font-size:1rem;flex-shrink:0}
.result-box{text-align:center;padding:20px 0}
.result-icon{font-size:3.5rem;margin-bottom:12px;animation:pop 0.5s ease}
@keyframes pop{0%{transform:scale(0.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.result-title{font-size:1.2rem;font-weight:800;color:#4ade80;margin-bottom:6px}
.result-sub{font-size:0.85rem;color:#4a6080;margin-bottom:20px}
.sheet-link{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#1e3a6e;border:1.5px solid #3b82f6;border-radius:12px;color:#93c5fd;font-weight:700;font-size:0.95rem;text-decoration:none;transition:all 0.2s;margin-bottom:10px}
.sheet-link:hover{background:#2a4d8e;transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,0.25)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🗺️ בחזרה לעתיד</h1>
    <p>אשף יצירת גיליון מסע</p>
    <span class="version-tag">v2.4</span>
  </div>
  <div class="card" id="card">
    <div class="steps-bar" id="stepsBar"></div>
    <div id="stepContent"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════════════
const CONFIG = {
  CLIENT_ID: '58131099622-0k834k0setbev2m18pv7vb3enh3bc8tr.apps.googleusercontent.com',
};

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const TOTAL_STEPS = 4;
let state = {
  step: 0,
  unitType: null,
  groupStructure: null,
  unitName: '',
  dateStart: '',
  dateEnd: '',
  groupCount: 6,
  accessToken: null,
  creating: false,
  progressStep: -1,
  resultUrl: null,
  error: null,
  scriptCode: null,
};

// ══════════════════════════════════════════════════════════════
//  RENDER HELPERS
// ══════════════════════════════════════════════════════════════
function setState(patch) { Object.assign(state, patch); render(); }
function setField(k, v)  { state[k] = v; const b = document.getElementById('continueBtn'); if(b) b.disabled = !state.unitName || !state.dateStart; }
function updateGroupCount(v) {
  const n = Math.max(2, Math.min(20, parseInt(v)||2));
  state.groupCount = n;
  const s = document.getElementById('gcSlider'); if(s) s.value = n;
  const i = document.getElementById('gcNum');    if(i) i.value = n;
  const p = document.getElementById('gcPreview');
  if(p) p.innerHTML = Array.from({length:n},(_,j)=>`<div class="group-chip">קבוצה ${j+1}</div>`).join('');
}
function render() {
  renderStepsBar();
  const fns = [stepUnitType, stepGroupStructure, stepDetails, stepCreate];
  document.getElementById('stepContent').innerHTML = fns[state.step]();
}
function renderStepsBar() {
  const html = Array.from({length:TOTAL_STEPS}, (_,i) => {
    const cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
    const icon = i < state.step ? '✓' : (i+1);
    return `<div class="step-item">
      <div class="step-circle ${cls}">${icon}</div>
      ${i < TOTAL_STEPS-1 ? `<div class="step-line ${i < state.step ? 'done' : ''}"></div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('stepsBar').innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
//  STEP 1: Unit type
// ══════════════════════════════════════════════════════════════
function stepUnitType() {
  return `
    <div class="step-title">סוג היחידה</div>
    <div class="step-sub">הבחירה תקבע את עמודות האיכון ואת מבנה לשוניות הקבוצות</div>
    <div class="options">
      <button class="opt-btn ${state.unitType==='naval'?'selected':''}" onclick="sel('unitType','naval')">
        <span class="opt-icon">⚓</span>
        <span class="opt-text"><strong>חיל הים / חיל האוויר</strong><span>עמודות: יחידה + מסגרת | מ"פ</span></span>
      </button>
      <button class="opt-btn ${state.unitType==='ground'?'selected':''}" onclick="sel('unitType','ground')">
        <span class="opt-icon">🪖</span>
        <span class="opt-text"><strong>זרוע היבשה</strong><span>עמודות: גד' + פלוגה + מחלקה | מ"פ + מ"מ</span></span>
      </button>
    </div>
    <div class="btn-row">
      <span></span>
      <button class="btn btn-primary" ${!state.unitType?'disabled':''} onclick="nextStep()">המשך ←</button>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  STEP 2: Group structure
// ══════════════════════════════════════════════════════════════
function stepGroupStructure() {
  return `
    <div class="step-title">מבנה הקבוצות</div>
    <div class="step-sub">איך בנויות הקבוצות במסע?</div>
    <div class="options">
      <button class="opt-btn ${state.groupStructure==='single'?'selected':''}" onclick="sel('groupStructure','single')">
        <span class="opt-icon">👥</span>
        <span class="opt-text"><strong>קבוצה = מחלקה אחת</strong><span>מ"פ + מ"מ לכל קבוצה</span></span>
      </button>
      <button class="opt-btn ${state.groupStructure==='multi'?'selected':''}" onclick="sel('groupStructure','multi')">
        <span class="opt-icon">🏗️</span>
        <span class="opt-text"><strong>קבוצה = כמה מחלקות</strong><span>רק מ"פ ללא מ"מ</span></span>
      </button>
      <button class="opt-btn ${state.groupStructure==='none'?'selected':''}" onclick="sel('groupStructure','none')">
        <span class="opt-icon">🙋</span>
        <span class="opt-text"><strong>ללא מפקד מלווה</strong><span>קבוצות ללא מפקד</span></span>
      </button>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()">← חזור</button>
      <button class="btn btn-primary" ${!state.groupStructure?'disabled':''} onclick="nextStep()">המשך ←</button>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  STEP 3: Details
// ══════════════════════════════════════════════════════════════
function stepDetails() {
  const ph = state.unitType==='naval' ? "חיל הים / חטיבה 7..." : "גד' 51 / חטיבה 215...";
  return `
    <div class="step-title">פרטי המסע</div>
    <div class="step-sub">מלא את הפרטים — הם ישמשו לשם הגיליון ולכל ה-labels</div>
    <div class="field-group">
      <label class="field-label">שם היחידה / החיל</label>
      <input class="field-input" type="text" placeholder="${ph}" id="unitNameInput"
        value="${state.unitName}"
        onkeyup="setField('unitName',this.value)"
        onblur="setField('unitName',this.value)">
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">תאריך פתיחה</label>
        <input class="field-input" type="text" placeholder="03/05/2026" id="dateStartInput"
          value="${state.dateStart}"
          onkeyup="setField('dateStart',this.value)"
          onblur="setField('dateStart',this.value)">
      </div>
      <div class="field-group">
        <label class="field-label">תאריך סיום</label>
        <input class="field-input" type="text" placeholder="07/05/2026" id="dateEndInput"
          value="${state.dateEnd}"
          onkeyup="setField('dateEnd',this.value)"
          onblur="setField('dateEnd',this.value)">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">מספר קבוצות</label>
      <div class="group-count-row">
        <input type="range" id="gcSlider" min="2" max="20" value="${state.groupCount}" oninput="updateGroupCount(this.value)">
        <input type="number" id="gcNum" class="group-count-num" min="2" max="20" value="${state.groupCount}" onchange="updateGroupCount(this.value)">
      </div>
      <div class="groups-preview" id="gcPreview">
        ${Array.from({length:state.groupCount},(_,i)=>`<div class="group-chip">קבוצה ${i+1}</div>`).join('')}
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()">← חזור</button>
      <button class="btn btn-primary" id="continueBtn" ${!state.unitName||!state.dateStart?'disabled':''} onclick="nextStep()">המשך ←</button>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  STEP 4: Create
// ══════════════════════════════════════════════════════════════
function stepCreate() {
  if (state.resultUrl)  return renderResult();
  if (state.creating)   return renderCreating();
  return renderConnectScreen();
}

function renderConnectScreen() {
  const isNaval = state.unitType === 'naval';
  const label = buildLabel();
  return `
    <div class="step-title">יצירת הגיליון</div>
    <div class="step-sub">סיכום ואישור — הגיליון יווצר ב-Drive של מוטי</div>
    <div class="summary-table">
      ${[
        ['יחידה', state.unitName],
        ['תאריכים', state.dateStart + (state.dateEnd?' — '+state.dateEnd:'')],
        ['מספר קבוצות', state.groupCount],
        ['מבנה', isNaval ? 'יחידה + מסגרת | מ"פ' : "גד' + פלוגה + מחלקה | מ\"פ + מ\"מ"],
        ['שם הגיליון', label],
      ].map(([l,v])=>`
        <div class="summary-row">
          <span class="summary-label">${l}</span>
          <span class="summary-value">${v}</span>
        </div>`).join('')}
    </div>
    <div class="connect-scopes">
      <div class="scope-item"><span class="scope-dot"></span>יצירת Spreadsheet ב-Google Sheets</div>
      <div class="scope-item"><span class="scope-dot"></span>שמירה ב-Drive שלך</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevStep()">← חזור</button>
      <button class="btn btn-primary" onclick="startOAuth()">🔗 התחבר ל-Google וצור גיליון</button>
    </div>`;
}

function renderCreating() {
  const steps = [
    { label: 'יוצר את הגיליון ב-Drive', icon: '📄' },
    { label: 'מגדיר לשוניות ועיצוב', icon: '🎨' },
    { label: 'מסיים', icon: '✅' },
  ];
  return `
    <div class="step-title">יוצר את הגיליון...</div>
    <div class="step-sub">זה ייקח כמה שניות</div>
    <div class="progress-steps">
      ${steps.map((s,i) => {
        const cls = i < state.progressStep ? 'done' : i === state.progressStep ? 'active' : 'waiting';
        const icon = i < state.progressStep ? '✅' : i === state.progressStep ? '<span class="spinner"></span>' : s.icon;
        return `<div class="prog-step ${cls}"><span class="prog-icon">${icon}</span><span>${s.label}</span></div>`;
      }).join('')}
    </div>
    ${state.error ? `<div class="alert alert-error">❌ ${state.error}</div>
    <div class="btn-row"><span></span><button class="btn btn-ghost" onclick="setState({creating:false,error:null,progressStep:-1})">נסה שוב</button></div>` : ''}`;
}

function renderResult() {
  return `
    <div class="result-box">
      <div class="result-icon">🎉</div>
      <div class="result-title">הגיליון מוכן!</div>
      <div class="result-sub">${buildLabel()}</div>
      <br>
      <a class="sheet-link" href="${state.resultUrl}" target="_blank">📊 פתח את הגיליון</a>
    </div>
    <div class="alert alert-info" style="font-size:0.82rem">
      💡 <strong>הצעדים הבאים:</strong><br>
      1. שתף את הגיליון עם המנחים (כתובות Gmail ספציפיות — לא קישור פתוח)<br>
      2. מלא את לשונית ״איכון״ — כותרות הקבוצות יתעדכנו אוטומטית
    </div>
    <div class="instructions" style="margin-top:12px">
      <div class="instructions-title">📤 אופציונלי — כפתור ייצוא אנשי קשר</div>
      <ul>
        <li data-n="1">בגיליון: <strong>Extensions → Apps Script</strong></li>
        <li data-n="2">מחק את הקוד הקיים והדבק את הקוד למטה</li>
        <li data-n="3">לחץ 💾 שמור ואז ▶️ Run → <strong>onOpen</strong></li>
        <li data-n="4">רענן את הגיליון — יופיע תפריט ״📤 ייצוא״</li>
      </ul>
      <div class="script-box" id="exportScript" style="max-height:120px;margin-top:10px">${(state.scriptCode||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:0.85rem" onclick="copyExportScript()" id="copyScriptBtn">📋 העתק קוד</button>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-ghost" onclick="setState({step:0,unitType:null,groupStructure:null,unitName:'',dateStart:'',dateEnd:'',groupCount:6,accessToken:null,creating:false,progressStep:-1,resultUrl:null,error:null,scriptCode:null})">⟳ מסע חדש</button>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  OAUTH
// ══════════════════════════════════════════════════════════════
let tokenClient = null;

function startOAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: [
      'https://www.googleapis.com/auth/spreadsheets',
      'https://www.googleapis.com/auth/drive.file',
    ].join(' '),
    callback: async (resp) => {
      if (resp.error) {
        const msg = `OAuth error: ${resp.error}` + (resp.error_description ? ` — ${resp.error_description}` : '');
        setState({creating:false, error: msg});
        return;
      }
      setState({ accessToken: resp.access_token, creating: true, progressStep: 0, error: null });
      await doCreateSheet(resp.access_token);
    }
  });
  tokenClient.requestAccessToken();
  setState({ creating: true, progressStep: 0, error: null });
}

// ══════════════════════════════════════════════════════════════
//  SHEET CREATION
// ══════════════════════════════════════════════════════════════
async function doCreateSheet(token) {
  try {
    const isNaval = state.unitType === 'naval';
    const hasMAM  = state.unitType === 'ground' && state.groupStructure !== 'none';
    const n       = state.groupCount;
    const label   = buildLabel();

    // ── Column definitions ──────────────────────────────────
    const icHeaders = isNaval
      ? ['קבוצה','יחידה','מסגרת','כמות','אישרו','קבוצת ווטסאפ','שם מ"פ','טלפון מ"פ','מנחה 1','מנחה 2',"יום א' התייצבות",'אוטובוס',"מסלול יום ב'",'מסלול יום ג\'',"יום ד'",'יום ה\'']
      : ['קבוצה',"גד'",'פלוגה','מחלקה','כמות','אישרו','קבוצת ווטסאפ','שם מ"פ','טלפון מ"פ','שם מ"מ','טלפון מ"מ','מנחה 1','מנחה 2',"יום א' התייצבות",'אוטובוס',"מסלול יום ב'",'מסלול יום ג\'',"יום ד'",'יום ה\''];

    // Guide columns (0-based): naval guide1=I(8),guide2=J(9) | ground guide1=L(11),guide2=M(12)
    const guide1Col = isNaval ? 'I' : 'L';
    const guide2Col = isNaval ? 'J' : 'M';

    const solHdr  = ['שם משפחה','שם פרטי','טלפון', isNaval ? 'יחידת רישום' : 'יחידה', 'רגישות מזון'];
    const pkHdr   = ['קבוצה','שם פרטי','שם משפחה','טלפון','מנחה'];
    const expHdr  = ['Name','Given Name','Family Name','Mobile Phone','Notes'];
    const NUM_SOL = solHdr.length;
    const HDR_ROW = 1; // row index of column headers in group sheets (0=title, 1=headers, 2+=soldiers)

    // ── 1. Create spreadsheet ────────────────────────────────
    // Tab order: איכון (0), קבוצה 1..N (1..N), פקל שמות (N+1)
    const sheetDefs = [
      { properties: { title: 'איכון',    index: 0 } },
      ...Array.from({length:n}, (_,i) => ({ properties: { title: `קבוצה ${i+1}`, index: i+1 } })),
      { properties: { title: 'פקל שמות', index: n+1 } },
      { properties: { title: 'EXPORT',   index: n+2 } },
    ];

    const createRes = await sheetsReq('', 'POST', {
      properties: { title: label, locale: 'iw' },
      sheets: sheetDefs,
    }, token);

    if (createRes.error) throw new Error(`Sheets createSpreadsheet: ${createRes.error.code} — ${createRes.error.message}`);

    const sid = createRes.spreadsheetId;
    const sheetMap = {};
    createRes.sheets.forEach(s => { sheetMap[s.properties.title] = s.properties.sheetId; });

    setState({ progressStep: 1 });

    // ── 2. batchUpdate ───────────────────────────────────────
    const reqs = [];

    // RTL all sheets
    Object.values(sheetMap).forEach(id => {
      reqs.push({ updateSheetProperties: { properties: { sheetId: id, rightToLeft: true }, fields: 'rightToLeft' } });
    });

    // ── איכון ──────────────────────────────────────────────
    const icId = sheetMap['איכון'];

    // Freeze 2 rows (title + headers)
    reqs.push({ updateSheetProperties: { properties: { sheetId: icId, gridProperties: { frozenRowCount: 2 } }, fields: 'gridProperties.frozenRowCount' } });

    // Row 0: merged title
    reqs.push({ mergeCells: { range: { sheetId: icId, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: icHeaders.length }, mergeType: 'MERGE_ALL' } });
    reqs.push({
      updateCells: {
        range: { sheetId: icId, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: 1 },
        rows: [{ values: [{ userEnteredValue: { stringValue: label }, userEnteredFormat: { backgroundColor: hexToRgb('#0d2540'), textFormat: { foregroundColor: {red:1,green:1,blue:1}, bold:true, fontSize:13 }, horizontalAlignment: 'CENTER', verticalAlignment: 'MIDDLE' } }] }],
        fields: 'userEnteredValue,userEnteredFormat',
      }
    });

    // Row 1: column headers
    reqs.push(makeCellsReq(icId, 1, icHeaders, '#1a3a5c'));

    // Rows 2+: group rows
    reqs.push({
      updateCells: {
        range: { sheetId: icId, startRowIndex: 2, endRowIndex: 2+n, startColumnIndex: 0, endColumnIndex: icHeaders.length },
        rows: Array.from({length:n}, (_,i) => ({
          values: [`קבוצה ${i+1}`, ...Array(icHeaders.length-1).fill('')].map(v => ({ userEnteredValue: { stringValue: v } }))
        })),
        fields: 'userEnteredValue',
      }
    });
    reqs.push({
      repeatCell: {
        range: { sheetId: icId, startRowIndex: 2, endRowIndex: 2+n, startColumnIndex: 0, endColumnIndex: icHeaders.length },
        cell: { userEnteredFormat: { horizontalAlignment: 'RIGHT' } },
        fields: 'userEnteredFormat.horizontalAlignment',
      }
    });

    // ── Group sheets ────────────────────────────────────────
    for (let g = 1; g <= n; g++) {
      const gid = sheetMap[`קבוצה ${g}`];
      const icRow = g + 2; // איכון: row1=title, row2=headers, row3+=data

      // Freeze 2 rows (title + column headers)
      reqs.push({ updateSheetProperties: { properties: { sheetId: gid, gridProperties: { frozenRowCount: 2 } }, fields: 'gridProperties.frozenRowCount' } });

      // Row 0: merged title — live formula from איכון
      const titleFormula = `="קב' ${g} - "&'איכון'!B${icRow}&" | ${label} | מנחים: "&'איכון'!${guide1Col}${icRow}&IF('איכון'!${guide2Col}${icRow}<>""," ו"&'איכון'!${guide2Col}${icRow},"")`;
      reqs.push({ mergeCells: { range: { sheetId: gid, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: NUM_SOL }, mergeType: 'MERGE_ALL' } });
      reqs.push({
        updateCells: {
          range: { sheetId: gid, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: 1 },
          rows: [{ values: [{ userEnteredValue: { formulaValue: titleFormula }, userEnteredFormat: { backgroundColor: hexToRgb('#1a3a5c'), textFormat: { foregroundColor: {red:1,green:1,blue:1}, bold:true, fontSize:12 }, horizontalAlignment: 'RIGHT', verticalAlignment: 'MIDDLE' } }] }],
          fields: 'userEnteredValue,userEnteredFormat',
        }
      });

      // Row 1: column headers
      reqs.push(makeCellsReq(gid, HDR_ROW, solHdr, '#0d3349', NUM_SOL));
    }

    // ── פקל שמות ────────────────────────────────────────────
    const pkId = sheetMap['פקל שמות'];
    reqs.push({ updateSheetProperties: { properties: { sheetId: pkId, gridProperties: { frozenRowCount: 1 } }, fields: 'gridProperties.frozenRowCount' } });
    reqs.push(makeCellsReq(pkId, 0, pkHdr, '#2d4a1e', pkHdr.length));

    // ── EXPORT (Google Contacts format) ─────────────────────
    const exId = sheetMap['EXPORT'];
    reqs.push({ updateSheetProperties: { properties: { sheetId: exId, gridProperties: { frozenRowCount: 1 } }, fields: 'gridProperties.frozenRowCount' } });
    reqs.push(makeCellsReq(exId, 0, expHdr, '#3a1a1a', expHdr.length));

    // ── Execute batchUpdate ──────────────────────────────────
    const batchRes = await sheetsReq(`/${sid}:batchUpdate`, 'POST', { requests: reqs }, token);
    if (batchRes.error) throw new Error(`batchUpdate: ${batchRes.error.code} — ${batchRes.error.message}`);

    setState({ creating: false, resultUrl: `https://docs.google.com/spreadsheets/d/${sid}`, scriptCode: buildExportScript(label) });

  } catch(e) {
    setState({ creating: false, error: e.message || 'שגיאה לא ידועה' });
  }
}

// ══════════════════════════════════════════════════════════════
//  API HELPERS
// ══════════════════════════════════════════════════════════════
async function sheetsReq(path, method, body, token) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets${path}`, {
    method,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

async function driveReq(path, method, body, token) {
  const r = await fetch(`https://www.googleapis.com/drive/v3${path}`, {
    method,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

function makeCellsReq(sheetId, rowIndex, headers, bgHex, numCols) {
  const n = numCols || headers.length;
  return {
    updateCells: {
      range: { sheetId, startRowIndex: rowIndex, endRowIndex: rowIndex+1, startColumnIndex: 0, endColumnIndex: n },
      rows: [{ values: headers.map(h => ({
        userEnteredValue: { stringValue: h },
        userEnteredFormat: {
          backgroundColor: hexToRgb(bgHex),
          textFormat: { foregroundColor: {red:1,green:1,blue:1}, bold:true },
          horizontalAlignment: 'RIGHT',
        }
      })) }],
      fields: 'userEnteredValue,userEnteredFormat',
    }
  };
}

function hexToRgb(hex) {
  return {
    red:   parseInt(hex.slice(1,3),16)/255,
    green: parseInt(hex.slice(3,5),16)/255,
    blue:  parseInt(hex.slice(5,7),16)/255,
  };
}

// ══════════════════════════════════════════════════════════════
//  NAVIGATION & UTILS
// ══════════════════════════════════════════════════════════════
function sel(k,v)  { setState({[k]:v}); }
function nextStep(){ if(state.step<TOTAL_STEPS-1) setState({step:state.step+1}); }
function prevStep(){ if(state.step>0) setState({step:state.step-1}); }

function buildLabel() {
  let dateLabel = '';
  if (state.dateStart) {
    const parts = state.dateStart.split('/');
    if (parts.length >= 2) dateLabel = parts[1].padStart(2,'0') + '.' + (parts[2]||'').slice(-2);
  }
  const sep = (state.unitName && dateLabel) ? ' | ' : ' ';
  return `בחזרה לעתיד | ${state.unitName}${sep}${dateLabel}`.trim();
}

// ══════════════════════════════════════════════════════════════
//  EXPORT SCRIPT GENERATOR
// ══════════════════════════════════════════════════════════════
function buildExportScript(label) {
  return `function onOpen() {
  SpreadsheetApp.getUi()
    .createMenu('📤 ייצוא')
    .addItem('הורד VCF — כל הקבוצות', 'exportAllVCF')
    .addItem('הורד VCF — קבוצה פעילה', 'exportActiveVCF')
    .addSeparator()
    .addItem('ייצא ל-Google Contacts', 'exportToContacts')
    .addSeparator()
    .addItem('התאם רוחב עמודות', 'autoResizeAll')
    .addToUi();
}

var MASA_LABEL = "${label}";

function exportAllVCF() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var vcf = '';
  ss.getSheets().forEach(function(sh) {
    if (sh.getName().indexOf('קבוצה') === 0) vcf += sheetToVCF(sh);
  });
  downloadVCF(vcf, 'כל_הקבוצות.vcf');
}

function exportActiveVCF() {
  var sh = SpreadsheetApp.getActiveSheet();
  if (sh.getName().indexOf('קבוצה') !== 0) {
    SpreadsheetApp.getUi().alert('עבור ללשונית קבוצה לפני הייצוא');
    return;
  }
  downloadVCF(sheetToVCF(sh), sh.getName() + '.vcf');
}

function sheetToVCF(sh) {
  var data = sh.getDataRange().getValues();
  var vcf = '';
  for (var r = 2; r < data.length; r++) {
    var row = data[r];
    var last = row[0] || '', first = row[1] || '';
    if (!last && !first) continue;
    var phone = String(row[2] || '');
    vcf += 'BEGIN:VCARD\\nVERSION:3.0\\n';
    vcf += 'N:' + last + ';' + first + ';;;\\n';
    vcf += 'FN:' + last + ' | ' + MASA_LABEL + '\\n';
    if (phone) vcf += 'TEL;TYPE=CELL:' + phone + '\\n';
    vcf += 'END:VCARD\\n';
  }
  return vcf;
}

function exportToContacts() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var created = 0, skipped = 0;
  ss.getSheets().forEach(function(sh) {
    if (sh.getName().indexOf('קבוצה') !== 0) return;
    var data = sh.getDataRange().getValues();
    for (var r = 2; r < data.length; r++) {
      var row = data[r];
      var last = String(row[0] || '').trim();
      var first = String(row[1] || '').trim();
      if (!last && !first) continue;
      var phone = String(row[2] || '').trim();
      try {
        var contact = {
          names: [{ familyName: last, givenName: first, displayName: last + ' | ' + MASA_LABEL }],
        };
        if (phone) {
          contact.phoneNumbers = [{ value: phone, type: 'mobile' }];
        }
        People.People.createContact(contact);
        created++;
      } catch(e) {
        skipped++;
      }
    }
  });
  SpreadsheetApp.getUi().alert('✅ נוצרו ' + created + ' אנשי קשר' + (skipped ? ' | דולגו: ' + skipped : ''));
}

function autoResizeAll() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  ss.getSheets().forEach(function(sh) {
    sh.autoResizeColumns(1, sh.getLastColumn());
  });
}

function downloadVCF(content, filename) {
  var file = DriveApp.getRootFolder().createFile(filename, content, 'text/vcard');
  var html = HtmlService.createHtmlOutput(
    '<p style="font-family:Arial;padding:10px">הקובץ מוכן! ' +
    '<a href="' + file.getDownloadUrl() + '" target="_blank">לחץ להורדה</a></p>'
  ).setWidth(300).setHeight(80);
  SpreadsheetApp.getUi().showModalDialog(html, filename);
}`;
}

function copyExportScript() {
  navigator.clipboard.writeText(state.scriptCode || '').then(() => {
    const btn = document.getElementById('copyScriptBtn');
    if (btn) { btn.textContent = '✅ הועתק!'; setTimeout(() => { if(btn) btn.textContent = '📋 העתק קוד'; }, 2000); }
  });
}

render();
